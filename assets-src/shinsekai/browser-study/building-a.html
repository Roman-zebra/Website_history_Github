<canvas id="view" aria-label="Building Aの3D模型"></canvas>
<section class="panel"><h1>Building A 室内接続の検証</h1>
<details open><summary>視点と小物</summary>
<p class="small">制作中のローカル模型。外観は1912年の写真と1905年の建築類型を参照。寸法・色・室内・備品・照明は推定です。</p>
<label>検証視点 <select id="viewpoint" disabled>
<option value="far">外観・遠景</option><option value="ground-street">外観・近景</option><option value="ground-axis">店内</option><option value="upper-axis">上階</option><option value="hero-counter">カウンター接写</option><option value="hero-stair-storage">階段収納接写</option><option value="hero-andon">行灯接写</option><option value="hero-shelf-goods">壺接写</option>
</select></label>
<label><input id="clearGlass" type="checkbox" checked> 室内に近い窓のガラス調整</label>
<button id="cash" disabled>現金引き出しを開く</button> <button id="storage" disabled>階段収納を開く</button>
<button id="capture" disabled>検証画像を保存</button>
<p id="status" role="status">模型を準備中…</p><p id="metrics" class="small"></p>
<p class="small">15m以内で室内を読み込み、18mを越えると解放。歩行・衝突・本番の有料配信は未実装。ドラッグで回転、ホイールで距離を調整できます。</p>
</details></section>
